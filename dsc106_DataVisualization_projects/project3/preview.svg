<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Climate Futures Explorer preview</title>
  <desc id="desc">Projected local warming pathways and a linked cross-location comparison.</desc>
  <rect width="1200" height="800" fill="#f8fbfc"/>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #172329; }
    .title { font-size: 42px; font-weight: 760; }
    .sub { font-size: 18px; fill: #5b696f; }
    .label { font-size: 16px; font-weight: 700; }
    .small { font-size: 13px; fill: #657278; }
  </style>
  <text class="title" x="62" y="65">Climate Futures Explorer</text>
  <text class="sub" x="62" y="98">When does local warming cross critical thresholds?</text>
  <rect x="48" y="130" width="1104" height="420" rx="8" fill="#fff" stroke="#d6e0e3"/>
  <line x1="120" y1="490" x2="1080" y2="490" stroke="#96a2a7"/>
  <line x1="120" y1="180" x2="120" y2="490" stroke="#96a2a7"/>
  <line x1="120" y1="325" x2="1080" y2="325" stroke="#c94c5c" stroke-dasharray="7 6"/>
  <text class="label" x="132" y="312" fill="#c94c5c">2°C threshold</text>
  <path d="M120 460 C250 445 350 420 470 395 S650 340 720 300 S900 230 1080 190" fill="none" stroke="#c94c5c" stroke-width="7"/>
  <path d="M120 460 C250 445 350 420 470 395 S650 360 720 335 S900 300 1080 278" fill="none" stroke="#f2a541" stroke-width="6"/>
  <path d="M120 460 C250 445 350 420 470 395 S650 375 720 365 S900 348 1080 338" fill="none" stroke="#68b984" stroke-width="6"/>
  <path d="M120 460 C250 445 350 420 470 395 S650 390 720 388 S900 382 1080 380" fill="none" stroke="#2b83ba" stroke-width="6"/>
  <text class="small" x="1000" y="178" fill="#c94c5c">SSP5-8.5</text>
  <text class="small" x="1000" y="266" fill="#f2a541">SSP3-7.0</text>
  <text class="small" x="1000" y="326" fill="#68b984">SSP2-4.5</text>
  <text class="small" x="1000" y="370" fill="#2b83ba">SSP1-2.6</text>
  <rect x="48" y="580" width="1104" height="160" rx="8" fill="#fff" stroke="#d6e0e3"/>
  <text class="label" x="75" y="616">Cross-location comparison · SSP2-4.5 · 2100</text>
  <g transform="translate(75 648)">
    <text class="small" x="0" y="12">Longyearbyen</text><line x1="120" y1="7" x2="520" y2="7" stroke="#68b984" stroke-width="5"/><circle cx="520" cy="7" r="8" fill="#68b984"/>
    <text class="small" x="0" y="45">New York</text><line x1="120" y1="40" x2="435" y2="40" stroke="#68b984" stroke-width="5"/><circle cx="435" cy="40" r="8" fill="#68b984"/>
    <text class="small" x="0" y="78">San Diego</text><line x1="120" y1="73" x2="285" y2="73" stroke="#68b984" stroke-width="5"/><circle cx="285" cy="73" r="8" fill="#68b984"/>
  </g>
</svg>
